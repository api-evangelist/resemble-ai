        success:
          type: boolean
        item:
          $ref: '#/components/schemas/IntelligencesUuidGetResponsesContentApplicationJsonSchemaItem'
      title: Intelligence_getIntelligence_Response_200
    IntelligencePostRequestBodyContentApplicationJsonSchemaMediaType:
