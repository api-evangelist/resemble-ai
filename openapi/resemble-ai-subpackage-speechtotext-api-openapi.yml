        updated_at:
          type: string
          format: date-time
      title: SpeechToTextPostResponsesContentApplicationJsonSchemaItem
    SpeechToTextGetResponsesContentApplicationJsonSchemaItemsItems:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        status:
          type: string
        duration_seconds:
          type: number
          format: double
        created_at:
