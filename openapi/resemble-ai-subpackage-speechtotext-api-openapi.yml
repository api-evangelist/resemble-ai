      - completed
      - failed
      title: SpeechToTextUuidGetResponsesContentApplicationJsonSchemaItemStatus
    Speech-to-Text_askTranscriptQuestion_Response_200:
      type: object
      properties:
        success:
          type: boolean
        item:
